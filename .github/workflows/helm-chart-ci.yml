name: Helm chart CI

on:
  push:
    branches: [main]
    paths:
      - 'operator/**'
      - 'cluster/**'
      - 'argocd/**'
      - 'README.md'
      - '.helmignore'
  pull_request:
    branches: [main]
    paths:
      - 'operator/**'
      - 'cluster/**'
      - 'argocd/**'
      - 'README.md'
      - '.helmignore'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag override (e.g. redis-v1.0.0)'
        required: false

concurrency: helm-chart-redis

jobs:
  ci:
    permissions:
      contents: write
      pull-requests: read
    uses: expectedbehaviors/github-actions/.github/workflows/helm-chart-ci.yml@main
    secrets: inherit
    with:
      chart_paths: |
        operator
        cluster
      tag_prefix: redis-v
      helm_repositories: |
        redis-operator=https://spotahome.github.io/redis-operator
      publish_enabled: false
      release_notes_enabled: true
      release_tag: ${{ github.event.inputs.release_tag || '' }}
